}

  let pos, size, colorHex;
  if (node.seed) {
    pos = new THREE.Vector3(0,0,0);
    size = 26;
    colorHex = 0xffffff;
  } else {
    const i = nonSeed.indexOf(node);
    pos = fibSpherePoint(i, total, radius);
    size = node.is_flower ? 12 : 7;
    colorHex = parseInt(COLOUR_HEX[node.colour] || COLOUR_HEX['not_flower']);
  }
  const geo = new THREE.SphereGeometry(size, 16, 16);
  const mat = new THREE.MeshStandardMaterial({color: colorHex, emissive: node.seed ? 0x552200 : 0x000000, emissiveIntensity: node.seed ? 0.4 : 0});
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.copy(pos);
  mesh.userData = node;
  scene.add(mesh);
  nodeMeshes[node.id] = mesh;
});

const edgeMat = new THREE.LineBasicMaterial({color: 0x3a3a45, transparent:true, opacity:0.5});
GRAPH.edges.forEach(function(e){
  const a = nodeMeshes[e.source], b = nodeMeshes[e.target];
  if (!a || !b) return;
  const geo = new THREE.BufferGeometry().setFromPoints([a.position, b.position]);
  scene.add(new THREE.Line(geo, edgeMat));
});

let dragging = false, lastX = 0, lastY = 0;
let camAngleX = 0.3, camAngleY = 0;
let camDist = 900;

function updateCamera() {
  camera.position.x = camDist * Math.sin(camAngleY) * Math.cos(camAngleX);
  camera.position.y = camDist * Math.sin(camAngleX);
  camera.position.z = camDist * Math.cos(camAngleY) * Math.cos(camAngleX);
  camera.lookAt(0,0,0);
}
updateCamera();

renderer.domElement.addEventListener('mousedown', function(e){ dragging = true; lastX = e.clientX; lastY = e.clientY; });
window.addEventListener('mouseup', function(){ dragging = false; });
window.addEventListener('mousemove', function(e){
  if (!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  camAngleY -= dx * 0.005;
  camAngleX = Math.max(-1.3, Math.min(1.3, camAngleX + dy * 0.005));
  lastX = e.clientX; lastY = e.clientY;
  updateCamera();
});
renderer.domElement.addEventListener('wheel', function(e){
  camDist = Math.max(200, Math.min(2500, camDist + e.deltaY * 0.5));
  updateCamera();
});

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const tooltip = document.getElementById('tooltip');
window.addEventListener('mousemove', function(e){
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(Object.values(nodeMeshes));
  if (hits.length) {
    const d = hits[0].object.userData;
    tooltip.style.display = 'block';
    tooltip.style.left = (e.clientX+12)+'px';
    tooltip.style.top = (e.clientY+12)+'px';
    tooltip.textContent = d.title + (d.seed ? ' (seed)' : (d.is_flower ? (' - flower: '+d.colour) : ' - not a flower'));
  } else {
    tooltip.style.display = 'none';
  }
});

function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', function(){
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

const legendNames = {
  red:'Red flower', pink:'Pink flower', white:'White flower', yellow:'Yellow flower',
  orange:'Orange flower', purple:'Purple flower', blue:'Blue flower', mixed:'Mixed-colour flower',
  unknown_color:'Flower, colour unknown', not_flower:'Not a flower'
};
const legendEl = document.getElementById('legend');
let legendHtml = '<b>Rose neighbourhood</b><br><span class="sw" style="background:#ffffff"></span>Seed: Rose<br>';
for (const key of Object.keys(legendNames)) {
  const hex = '#' + parseInt(COLOUR_HEX[key]).toString(16).padStart(6,"0");
  legendHtml += '<span class="sw" style="background:' + hex + '"></span>' + legendNames[key] + '<br>';
}
legendEl.innerHTML = legendHtml;
</script>
</body>
</html>
