<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fieldwork — Equipment library</title>
<link rel="stylesheet" href="/style.css">
<body>
  <header><a href="/" class="brand">FIELDWORK<span>Equipment library</span></a><span class="badge">London studio</span></header>
  <main>
    <p class="eyebrow">LESS SEARCHING. MORE MAKING.</p>
    <h1>Find your next<br>great tool.</h1>
    <p class="intro">Cameras, lights, and the little things that bring an idea to life.</p>
    <label for="search">Search equipment</label>
    <div class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Try camera, light, or tripod" autocomplete="off"><button id="clear" type="button">Clear</button></div>
    <p id="status" role="status" aria-live="polite">Start typing to explore the library.</p>
    <ul id="results" aria-label="Search results"></ul>
    <footer>A shared collection for curious people.<span>FIELDWORK / 2026</span></footer>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
