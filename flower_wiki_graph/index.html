<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wikipedia Flower Steiner Graph</title><style>
html,body{margin:0;height:100%;overflow:hidden;background:#071018;color:#eaf6ef;font:14px system-ui}#info{position:fixed;z-index:2;left:18px;top:16px;padding:12px 15px;background:#071018cc;border:1px solid #38515e;border-radius:10px;max-width:360px}b{color:#ff8fc7}.key{margin-top:7px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}.flower{background:#ff4fa3}.connector{background:#50c8ff}canvas{display:block}</style></head><body>
<div id="info"><b>English Wikipedia flower Steiner graph</b><br>4 Wikidata flower terminals connected by 3 non-flower nodes.<div class="key"><span class="dot flower"></span> flower terminal &nbsp; <span class="dot connector"></span> connector</div></div>
<script src="graph_data.js"></script><script src="https://unpkg.com/three@0.164.1/build/three.min.js"></script><script>
const G=window.FLOWER_GRAPH, scene=new THREE.Scene();scene.background=new THREE.Color(0x071018);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,100);camera.position.set(0,2,12);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0xffffff,1.8));const light=new THREE.PointLight(0xffffff,45);light.position.set(3,5,7);scene.add(light);
const pos={'ISBN (identifier)':[0,0,0],'Nanohana':[-4,2,0],'Hops':[-4,-2,0],'Banana':[2.4,1.8,0],'Banana flower':[5,2.7,0],'Asteraceae':[2.4,-1.8,0],'Ray florets':[5,-2.7,0]};
function label(text,p){const c=document.createElement('canvas'),x=c.getContext('2d');c.width=512;c.height=80;x.font='32px system-ui';x.textAlign='center';x.fillStyle='#f4fff8';x.fillText(text,256,45);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthTest:false}));s.position.set(p[0],p[1]-.58,p[2]);s.scale.set(3.1,.48,1);scene.add(s)}
const byId={};G.nodes.forEach(n=>{const p=pos[n.id], geo=n.terminal?new THREE.IcosahedronGeometry(.38,2):new THREE.SphereGeometry(.30,24,16), mat=new THREE.MeshStandardMaterial({color:n.terminal?0xff4fa3:0x50c8ff,roughness:.32,metalness:.15,emissive:n.terminal?0x3b071f:0x062737});const m=new THREE.Mesh(geo,mat);m.position.fromArray(p);m.userData=n;scene.add(m);byId[n.id]=m;label(n.label,p)});
const lm=new THREE.LineBasicMaterial({color:0x80a6b8,transparent:true,opacity:.72});G.edges.forEach(e=>{const pts=[byId[e.source].position,byId[e.target].position];scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),lm))});
const stars=new THREE.BufferGeometry(),sp=[];for(let i=0;i<450;i++)sp.push((Math.random()-.5)*30,(Math.random()-.5)*18,-5-Math.random()*8);stars.setAttribute('position',new THREE.Float32BufferAttribute(sp,3));scene.add(new THREE.Points(stars,new THREE.PointsMaterial({color:0x315162,size:.025})));
let mx=0,my=0;addEventListener('pointermove',e=>{mx=(e.clientX/innerWidth-.5)*.5;my=(e.clientY/innerHeight-.5)*.25});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});function loop(t){scene.rotation.y+=(mx-scene.rotation.y)*.025;scene.rotation.x+=(-my-scene.rotation.x)*.025;G.nodes.forEach(n=>{if(n.terminal)byId[n.id].rotation.y=t*.0005});renderer.render(scene,camera);requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
